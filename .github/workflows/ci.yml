name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # The shipped artefacts, shared by several jobs. Kept here so a change to one
  # of them is a single edit rather than five.
  CORPUS: examples/corpus.jsonl.gz
  HOLDOUT: examples/holdout.jsonl.gz
  BASELINE: examples/baseline.json

jobs:
  quality:
    name: Lint, format, types, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev --group docs

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Build the documentation site
        # The builder fails on a broken internal link, so a renamed page fails
        # the pull request rather than shipping a 404.
        run: uv run --only-group docs python scripts/build_site.py --output _site

  test:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every marker declared in pyproject.toml. A layer that exists and is
        # never selected is a layer nobody runs.
        layer: [unit, integration, security, e2e, meta]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: pytest -m ${{ matrix.layer }}
        # Bare, with no coverage flag: a matrix leg that inherited the coverage
        # gate would fail on every leg but the full one, for a reason that has
        # nothing to do with the layer it is reporting on.
        run: uv run pytest -m ${{ matrix.layer }} -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: Full suite with the coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  gates:
    name: The firewall measures itself
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: doctor
        # Proves the installation works end to end, and reports the feature
        # hash-collision rate before anything downstream depends on it.
        run: uv run pifw doctor

      - name: The committed corpora still match their plans
        # Catches a corpus regenerated by a different build, or edited by hand.
        #
        # Not "regenerate and git diff": that compares bytes, and gzip carries
        # things no consumer reads. This compares the digest over the samples.
        #
        # The second command also re-asserts disjointness. The holdout is
        # generated with the training set excluded, and a holdout that quietly
        # overlaps its training corpus reports optimism as detection.
        run: |
          uv run pifw check --plan main --corpus "$CORPUS"
          uv run pifw check --plan holdout --corpus "$HOLDOUT" --disjoint-from "$CORPUS"

      - name: The twelve-fold evaluation, gated against the committed baseline
        # Holds out each attack family in turn, disables the countermeasures
        # that family motivated, retrains, and measures the bypass rate against
        # a technique the detector has never seen. Fails on a regression against
        # the recorded per-family rates, on a pooled regression, on a regression
        # in the random-split control, and on exceeding the false-positive
        # budget. It also refuses to report a number for any fold whose model
        # did not converge, which exits 2 rather than publishing a figure that
        # looks exactly like a measurement.
        run: |
          uv run pifw evaluate \
            --corpus "$CORPUS" \
            --eval-corpus "$HOLDOUT" \
            --baseline "$BASELINE" \
            --json-out reports/evaluation.json \
            --junit-out reports/evaluation.xml \
            --markdown-out reports/evaluation.md

      - name: The gate fires when the firewall gets worse
        # Asserts five things: the shipped firewall passes its committed
        # baseline; the gate fails a family that regressed; it fails a family
        # present in the baseline that this run did not measure; it fails a
        # family measured that the baseline does not carry; and it fails a run
        # that exceeded the false-positive budget. A gate nobody has watched go
        # red is a gate nobody knows the exit code of.
        run: uv run python scripts/check-firewall.py

      - name: Publish the summary
        if: always()
        run: cat reports/evaluation.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports
          path: reports/
          if-no-files-found: error

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Run every example
        # They are documentation that executes. One that stops working is a
        # README that lies.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/unseen_technique_demo.py
          uv run python examples/false_positive_demo.py

  build:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build the wheel and sdist
        run: uv build

      - name: The wheel installs and its console script works
        # Building is not the same as being installable. This catches a missing
        # package directory or a broken entry point, which a source checkout
        # never notices because the source directory is importable anyway.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/pifw --version
          /tmp/verify/bin/pifw rules > /dev/null
